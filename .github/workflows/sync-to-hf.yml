name: Deploy a Hugging Face Spaces

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # cada lunes: reconstruye con la última versión de yt-dlp
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git commit --allow-empty -m "Rebuild semanal"
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
